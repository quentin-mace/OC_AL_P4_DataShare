# Sert le build de production du front pendant les mesures Lighthouse.
#
# Le serveur de developpement Vite ne convient pas : il livre chaque module
# separement et sans minification, ce qui ferait mesurer autre chose que ce
# que l'utilisateur telecharge.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # React Router possede les URLs cote navigateur : sans ce repli, toute
    # page autre que "/" repondrait 404 et Lighthouse mesurerait l'erreur.
    location / {
        try_files $uri /index.html;
    }

    # La compression est active en connaissance de cause : c'est le poids
    # reellement transfere qui fait foi dans un budget de performance, pas la
    # taille des fichiers sur le disque.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
