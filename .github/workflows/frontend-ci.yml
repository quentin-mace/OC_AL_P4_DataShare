name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'DataShare_Front/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'DataShare_Front/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: DataShare_Front

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node directement plutot que le conteneur de dev : l'image n'ajoute rien
      # ici (pas de service a joindre), et setup-node met le cache npm en place.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DataShare_Front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      # tsc -b fait partie du build : c'est ici que les types sont verifies.
      - name: Type check and build
        run: npm run build

      - name: Tests (Vitest + couverture, seuil 70 %)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: DataShare_Front/coverage/
          if-no-files-found: ignore
