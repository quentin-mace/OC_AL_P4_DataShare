monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Performance measurements, kept apart from the application log: one
        # JSON line per request and per stored object, meant to be aggregated
        # rather than read. See perf/bin/metrics.sh.
        - metrics

when@dev:
    monolog:
        handlers:
            # Written to the container's standard error rather than to a file:
            # "docker compose logs php" is then the only place to look, in
            # development as in production, and nothing has to be read from
            # inside the container.
            metrics:
                type: stream
                path: php://stderr
                level: info
                channels: [metrics]
                formatter: monolog.formatter.json
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                # Metrics are excluded here, the handler above already carries
                # them; without this every measurement would be written twice.
                channels: ["!event", "!metrics"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!metrics"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            metrics:
                type: stream
                path: php://stderr
                level: info
                channels: [metrics]
                formatter: monolog.formatter.json
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!metrics"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!metrics"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
