api_platform:
    title: DataShare API
    version: 1.0.0
    # Plain JSON: the default JSON-LD brings nothing to a hand-written front-end.
    formats:
        json: ['application/json']
    # Errors stay in RFC 7807, which names the offending fields under "violations".
    error_formats:
        jsonproblem: ['application/problem+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
