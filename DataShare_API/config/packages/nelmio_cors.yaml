nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        # Retry-After accompanies every 429 (login, download password): without
        # it here, the browser hides it from the front-end.
        expose_headers: ['Link', 'Retry-After']
        max_age: 3600
    paths:
        '^/': null
