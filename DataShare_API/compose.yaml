
services:
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  # Interface web pour inspecter/modifier la base pendant les tests manuels.
  # Image "standalone" : serveur PHP integre, pas besoin d'un nginx dedie.
  adminer:
    image: adminer:4-standalone
    depends_on:
      database:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: database

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    depends_on:
      database:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ./:/srv/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8

  nginx:
    image: nginx:alpine
    depends_on:
      - php
    volumes:
      - ./public:/srv/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Stockage objet compatible S3, en remplacement de MinIO dont les images ne
  # sont plus servies par aucun registre public (voir tech_stack.md).
  #
  # "server -s3" demarre master, volume, filer et passerelle S3 dans un seul
  # processus : la forme mono-conteneur que le developpement demande, la
  # repartition sur plusieurs conteneurs n'ayant de sens qu'en exploitation.
  storage:
    image: chrislusf/seaweedfs:4.47
    command: server -s3 -dir=/data
    healthcheck:
      # curl n'est pas dans l'image, wget si. L'adresse est en clair plutot
      # que "localhost", que le conteneur resout d'abord en IPv6, sur
      # laquelle la passerelle S3 n'ecoute pas : le test echouerait toujours.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - storage_data:/data

  # Le bucket n'existe pas au premier demarrage. Un conteneur d'init dedie,
  # comme du temps de MinIO, pour que php puisse attendre sa fin par
  # service_completed_successfully.
  storage-init:
    image: amazon/aws-cli:2.37.4
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_KEY:-datashare}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET:-!ChangeMe!}
      AWS_DEFAULT_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-datashare}
    # create-bucket echoue si le bucket existe, d'ou le head-bucket prealable
    # qui rend la cible rejouable.
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://storage:8333 s3api head-bucket --bucket $$STORAGE_S3_BUCKET 2>/dev/null ||
      aws --endpoint-url http://storage:8333 s3api create-bucket --bucket $$STORAGE_S3_BUCKET
      "

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  storage_data:
